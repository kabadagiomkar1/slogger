[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slogger"
description = "Structured logging in python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["logging", "logger", "structured", "structured logging", "structured logger", "slog"]
authors = [
  {email = "kabadagiomkar@gmail.com", name = "Omkar Kabadagi"},
]
maintainers = [
  {email = "kabadagiomkar@gmail.com", name = "Omkar Kabadagi"},
]
version = "0.2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
examples = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
slogger = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do not add src/ to pythonpath: tests must import the installed package.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["slogger"]
